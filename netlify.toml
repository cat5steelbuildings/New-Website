[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# /sheds: old shed page removed Nov 25 2026 (supplier deal ended); new shed line page coming. Send visitors home for now.
[[redirects]]
  from = "/sheds/*"
  to = "/"
  status = 302
